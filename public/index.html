<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <title>Agorà Gestionale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      :root {
        --font: 'DM Sans', system-ui, -apple-system, sans-serif;
        --bg: #f7fee7;
        --surface: #ffffff;
        --border: #ecfccb;
        --border-light: #f7fee7;
        --text: #0d1117;
        --text-secondary: #4b5563;
        --text-muted: #9ca3af;
        
        --grad-primary: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
        --grad-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        --grad-success: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
        --grad-blue: linear-gradient(135deg, #84cc16 0%, #6366f1 100%);
        --grad-orange: linear-gradient(135deg, #f97316 0%, #eab308 100%);
        
        --primary: #84cc16;
        --primary-dark: #4d7c0f;
        --primary-light: #ecfccb;
        --secondary: #65a30d;
        --success: #84cc16;
        --warning: #f59e0b;
        --danger: #ef4444;
        
        --shadow-sm: 0 1px 3px rgba(132,204,22,0.08), 0 1px 2px rgba(0,0,0,0.04);
        --shadow: 0 4px 16px rgba(132,204,22,0.12), 0 2px 4px rgba(0,0,0,0.04);
        --shadow-lg: 0 10px 40px rgba(132,204,22,0.18), 0 4px 12px rgba(0,0,0,0.06);
        --shadow-glow: 0 0 0 3px rgba(132,204,22,0.2);
        
        --radius: 12px;
        --radius-sm: 8px;
        --radius-lg: 16px;
        --radius-xl: 24px;
      }

      html { font-size: 14px; -webkit-font-smoothing: antialiased; }
      
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

      /* Focus */
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--primary) !important;
        box-shadow: var(--shadow-glow) !important;
      }

      /* Table hover */
      tr:hover td { background: #faf9ff !important; }

      button:disabled { opacity: 0.45; cursor: not-allowed; }
      
      /* Transizioni globali */
      button { transition: all 0.15s ease; }
      button:hover:not(:disabled) { transform: translateY(-1px); }
      button:active:not(:disabled) { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
